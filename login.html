<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Login | TriDashai.com</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body{background:#fff;color:#1e293b}
    .ambient-glow-1{position:absolute;top:-120px;left:-100px;width:600px;height:600px;background:radial-gradient(circle,rgba(37,99,235,.04),transparent 70%);filter:blur(140px);pointer-events:none;z-index:0}
    .podium-card-3d{background:#fff;border:1px solid rgba(37,99,235,.12);box-shadow:0 15px 35px rgba(30,41,59,.04);position:relative;overflow:hidden;color:#1e293b}
    .btn-podium-primary{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;font-weight:700;border:1px solid rgba(255,255,255,.4)}
    .btn-podium-primary:hover{background:linear-gradient(135deg,#1d4ed8,#1e40af);box-shadow:0 10px 25px rgba(37,99,235,.25)}
  </style>
</head>
<body class="font-sans antialiased flex flex-col min-h-screen justify-between relative overflow-x-hidden">
  <div class="ambient-glow-1"></div>

  <header class="bg-white/90 sticky top-0 z-50 backdrop-blur-md border-b border-slate-200 shadow-sm">
    <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
      <a href="index.html" class="text-xl font-extrabold tracking-tight"><span class="text-blue-600">Tri</span><span class="text-slate-900">Dashai.com</span></a>
      <a href="index.html" class="text-xs font-semibold text-slate-700 px-3 py-2 rounded-lg bg-slate-100 border border-slate-200">← Back to Home</a>
    </div>
  </header>

  <main class="flex-1 relative z-10 py-16 px-4 flex flex-col justify-center max-w-md mx-auto w-full">
    <div class="podium-card-3d p-8 sm:p-10 rounded-3xl shadow-xl space-y-6">
      <div class="text-center">
        <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 mb-2">Welcome Back</h1>
        <p class="text-slate-600 text-xs sm:text-sm">Log in to manage your TriDashAI account.</p>
      </div>

      <div id="message" role="alert" class="hidden rounded-xl p-3 text-sm"></div>

      <form id="login-form" class="space-y-4">
        <div>
          <label for="email" class="block text-xs font-semibold text-slate-700 mb-1">Business Email</label>
          <input id="email" type="email" autocomplete="email" required placeholder="you@business.com" class="w-full bg-white border border-slate-300 rounded-xl px-4 py-3 text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm">
        </div>

        <div>
          <div class="flex justify-between items-center mb-1">
            <label for="password" class="text-xs font-semibold text-slate-700">Password</label>
            <button id="forgot-password" type="button" class="text-[11px] text-blue-600 hover:underline font-semibold">Forgot password?</button>
          </div>
          <input id="password" type="password" autocomplete="current-password" required placeholder="Your password" class="w-full bg-white border border-slate-300 rounded-xl px-4 py-3 text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm">
        </div>

        <button id="login-button" type="submit" class="w-full py-4 btn-podium-primary rounded-xl shadow-lg text-sm">Log In to Dashboard →</button>
      </form>
      <button id="resend-verification" type="button" class="hidden w-full text-sm text-blue-700 underline">Resend verification email</button>

      <div class="flex items-center my-2">
        <div class="flex-grow border-t border-slate-200"></div>
        <span class="mx-3 text-[11px] text-slate-400 uppercase tracking-wider font-semibold">Or</span>
        <div class="flex-grow border-t border-slate-200"></div>
      </div>

      <button id="google-button" type="button" class="w-full py-3 bg-white hover:bg-slate-50 border border-slate-300 text-slate-800 font-semibold rounded-xl shadow-sm text-sm">Continue with Google</button>

      <div class="text-center text-xs text-slate-500 pt-2">
        <p>Don't have an account yet? <a href="kelvsignup.html" class="text-blue-600 font-semibold hover:underline">Start your free trial</a></p>
      </div>
    </div>
  </main>

  <footer class="border-t border-slate-200 bg-white py-8 text-center text-xs text-slate-500 relative z-10">
    <div class="max-w-4xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4">
      <p>&copy; TriDashai.com. All rights reserved.</p>
      <div class="flex items-center gap-4">
        <a href="terms.html">Terms of Service</a>
        <span>•</span>
        <a href="privacy.html">Privacy Policy</a>
      </div>
    </div>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBTGwDZYtUjJX0FQJtVJr5CIeqiskYhI6k",
      authDomain: "tridashai-app.firebaseapp.com",
      projectId: "tridashai-app",
      storageBucket: "tridashai-app.firebasestorage.app",
      messagingSenderId: "753320728065",
      appId: "1:753320728065:web:83745fcca31b12e08a5200",
      measurementId: "G-W9MYFE3B77"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const messageBox = document.getElementById('message');

    function showMessage(message, isError = true) {
      messageBox.textContent = message;
      messageBox.className = 'rounded-xl p-3 text-sm ' + (isError
        ? 'bg-red-50 text-red-700 border border-red-200'
        : 'bg-green-50 text-green-700 border border-green-200');
      messageBox.classList.remove('hidden');
    }

    function friendlyError(error) {
      const messages = {
        'auth/invalid-credential': 'The email or password is incorrect.',
        'auth/user-not-found': 'No account was found for that email address.',
        'auth/wrong-password': 'The email or password is incorrect.',
        'auth/invalid-email': 'Please enter a valid email address.',
        'auth/too-many-requests': 'Too many attempts. Please wait a while and try again.',
        'auth/popup-closed-by-user': 'The Google sign-in window was closed before completion.'
      };

      return messages[error.code] || error.message || 'Sign-in failed. Please try again.';
    }

    auth.onAuthStateChanged(user => {
      if (user && user.emailVerified) window.location.replace('dashboard.html');
    });

    document.getElementById('login-form').addEventListener('submit', async event => {
      event.preventDefault();

      const button = document.getElementById('login-button');
      button.disabled = true;
      button.textContent = 'Signing in…';

      try {
        const credential=await auth.signInWithEmailAndPassword(
          document.getElementById('email').value.trim(),
          document.getElementById('password').value
        );
        await credential.user.reload();
        if(!credential.user.emailVerified){
          await auth.signOut();
          showMessage('Please verify your email before logging in. Open the verification link we sent you. You can request another link below.',true);
          document.getElementById('resend-verification').classList.remove('hidden');
          button.disabled=false;
          button.textContent='Log In to Dashboard →';
          return;
        }
        window.location.replace('dashboard.html');

      } catch (error) {
        showMessage(friendlyError(error));
        button.disabled = false;
        button.textContent = 'Log In to Dashboard →';
      }
    });

    document.getElementById('resend-verification').addEventListener('click', async () => {
      const email=document.getElementById('email').value.trim();
      const password=document.getElementById('password').value;
      if(!email||!password){showMessage('Enter your email and password first so we can resend the verification link.');return;}
      try{
        const credential=await auth.signInWithEmailAndPassword(email,password);
        await credential.user.sendEmailVerification({
          url:'https://tridashai.com/verify-email.html',
          handleCodeInApp:false
        });
        await auth.signOut();
        showMessage('A new verification email has been sent. Please check your inbox and spam folder.',false);
      }catch(error){showMessage(friendlyError(error));}
    });

    document.getElementById('google-button').addEventListener('click', async () => {
      try {
        const provider = new firebase.auth.GoogleAuthProvider();
        await auth.signInWithPopup(provider);
        window.location.replace('dashboard.html');

      } catch (error) {
        showMessage(friendlyError(error));
      }
    });

    document.getElementById('forgot-password').addEventListener('click', async () => {
      const email = document.getElementById('email').value.trim();

      if (!email) {
        showMessage('Enter your email address first, then select Forgot password.');
        return;
      }

      try {
        await auth.sendPasswordResetEmail(email);
        showMessage('Password reset email sent. Please check your inbox.', false);

      } catch (error) {
        showMessage(friendlyError(error));
      }
    });
  </script>
</body>
</html>
