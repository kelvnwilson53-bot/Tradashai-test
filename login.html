<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Login - TriDash AI</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-slate-300 font-sans antialiased selection:bg-blue-600 selection:text-white min-h-screen flex flex-col justify-between">

    <!-- HEADER -->
    <header class="border-b border-slate-800 py-4 bg-black">
        <div class="max-w-4xl mx-auto px-4 flex justify-between items-center">
            <a href="index.html" class="text-xl font-bold text-white tracking-tight">
                TriDash<span class="text-blue-500 font-light">AI.com</span>
            </a>
            <a href="index.html" class="text-sm text-slate-400 hover:text-white transition">← Back to Home</a>
        </div>
    </header>

    <!-- MAIN LOGIN CARD -->
    <main class="max-w-md mx-auto px-4 py-16 flex-1 w-full flex flex-col justify-center">
        <div class="bg-slate-950 p-8 sm:p-10 rounded-3xl border border-slate-800 shadow-2xl space-y-6">
            
            <div class="text-center">
                <h1 class="text-2xl sm:text-3xl font-extrabold text-white mb-2">Welcome Back</h1>
                <p class="text-slate-400 text-xs sm:text-sm">Log in to manage your missed calls and review settings.</p>
            </div>

            <hr class="border-slate-800">

            <!-- LOGIN FORM -->
            <form action="dashboard.html" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Business Email</label>
                    <input type="email" required placeholder="you@business.com" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 text-sm">
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="text-xs font-semibold text-slate-400">Password</label>
                        <a href="#" class="text-[11px] text-blue-400 hover:underline">Forgot password?</a>
                    </div>
                    <input type="password" required placeholder="••••••••" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 text-sm">
                </div>

                <button type="submit" class="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl transition shadow-lg text-sm cursor-pointer mt-2">
                    Log In to Dashboard →
                </button>
            </form>

            <div class="text-center text-xs text-slate-500 pt-2">
                <p>Don't have an active pilot yet? <a href="signup.html" class="text-blue-400 font-semibold hover:underline">Start here</a></p>
            </div>

        </div>
    </main>

    <!-- FOOTER -->
    <footer class="border-t border-slate-800 py-8 text-center text-xs text-slate-500">
        <p>&copy; TriDash AI. All rights reserved. 
            <a href="terms.html" class="underline hover:text-slate-400 ml-2">Terms & Conditions</a> | 
            <a href="privacy.html" class="underline hover:text-slate-400 ml-1">Privacy Policy</a>
        </p>
    </footer>

</body>
</html>
