<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Login | TriDashai.com</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html {
            scroll-behavior: smooth;
        }

        body {
            background: #ffffff;
            color: #1e293b;
        }

        .ambient-glow-1 {
            position: absolute;
            top: -120px;
            left: -100px;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.04) 0%, rgba(29, 78, 216, 0.02) 50%, transparent 70%);
            filter: blur(140px);
            pointer-events: none;
            z-index: 0;
        }

        .podium-card-3d {
            background: #ffffff;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(37, 99, 235, 0.12);
            box-shadow: 0 15px 35px rgba(30, 41, 59, 0.04), 0 1px 1px rgba(255, 255, 255, 1) inset;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
            color: #1e293b;
        }

        .btn-podium-primary {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: #ffffff;
            font-weight: 700;
            transition: all 0.25s ease;
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .btn-podium-primary:hover {
            background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.35);
            transform: translateY(-2px);
        }
    </style>
</head>
<body id="top" class="font-sans antialiased selection:bg-[#2563eb] selection:text-white flex flex-col min-h-screen justify-between relative overflow-x-hidden">

    <div class="ambient-glow-1"></div>

    <!-- HEADER -->
    <header class="bg-white/90 sticky top-0 z-50 backdrop-blur-md border-b border-slate-200 shadow-sm">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="index.html" class="text-xl font-extrabold tracking-tight whitespace-nowrap leading-none not-italic">
                <span class="text-[#2563eb]">Tri</span><span class="text-slate-900">Dashai.com</span>
            </a>
            <a href="index.html" class="inline-flex items-center gap-1.5 text-xs font-semibold text-slate-700 hover:text-slate-900 px-3 py-2 rounded-lg bg-slate-100 border border-slate-200 transition shadow-sm">
                <span>← Back to Home</span>
            </a>
        </div>
    </header>

    <!-- MAIN LOGIN CARD -->
    <main class="flex-1 relative z-10 py-16 px-4 flex flex-col justify-center max-w-md mx-auto w-full">
        <div class="podium-card-3d p-8 sm:p-10 rounded-3xl shadow-xl space-y-6">
            
            <div class="text-center">
                <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 mb-2">Welcome Back</h1>
                <p class="text-slate-600 text-xs sm:text-sm">Log in to manage your missed calls and review settings.</p>
            </div>

            <!-- LOGIN FORM (First) -->
            <form action="dashboard.html" method="GET" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Business Email</label>
                    <input type="email" required placeholder="you@business.com" class="w-full bg-white border border-slate-300 rounded-xl px-4 py-3 text-slate-900 focus:outline-none focus:ring-2 focus:ring-[#2563eb] text-xs sm:text-sm shadow-sm">
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="text-xs font-semibold text-slate-700">Password</label>
                        <a href="#" onclick="alert('Password reset link sent to your email.'); return false;" class="text-[11px] text-[#2563eb] hover:underline font-semibold">Forgot password?</a>
                    </div>
                    <input type="password" required placeholder="••••••••" class="w-full bg-white border border-slate-300 rounded-xl px-4 py-3 text-slate-900 focus:outline-none focus:ring-2 focus:ring-[#2563eb] text-xs sm:text-sm shadow-sm">
                </div>

                <button type="submit" class="w-full py-4 btn-podium-primary text-center font-bold rounded-xl transition shadow-lg text-xs sm:text-sm cursor-pointer mt-2">
                    Log In to Dashboard →
                </button>
            </form>

            <div class="flex items-center my-2">
                <div class="flex-grow border-t border-slate-200"></div>
                <span class="flex-shrink mx-3 text-[11px] text-slate-400 uppercase tracking-wider font-semibold">Or</span>
                <div class="flex-grow border-t border-slate-200"></div>
            </div>

            <!-- GOOGLE SIGN-IN BUTTON (Underneath) -->
            <div>
                <button type="button" onclick="window.location.href='dashboard.html'" class="w-full py-3 bg-white hover:bg-slate-50 border border-slate-300 text-slate-800 font-semibold rounded-xl transition shadow-sm text-xs sm:text-sm flex items-center justify-center gap-2.5">
                    <svg class="w-4 h-4" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
                        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.19v3.15C3.17 21.36 7.23 24 12 24z"/>
                        <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.19C.43 8.12 0 9.87 0 12s.43 3.88 1.19 5.42l4.09-3.15z"/>
                        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.17 2.64 1.19 6.58l4.09 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
                    </svg>
                    <span>Sign in with Google</span>
                </button>
            </div>

            <div class="text-center text-xs text-slate-500 pt-2">
                <p>Don't have an active trial yet? <a href="kelvsignup.html" class="text-[#2563eb] font-semibold hover:underline">Start here</a></p>
            </div>

        </div>
    </main>

    <!-- FOOTER -->
    <footer class="border-t border-slate-200 bg-white py-8 text-center text-xs text-slate-500 relative z-10">
        <div class="max-w-4xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4">
            <p>&copy; TriDashai.com. All rights reserved.</p>
            <div class="flex items-center gap-4">
                <a href="terms.html" class="hover:text-slate-900 transition">Terms of Service</a>
                <span>•</span>
                <a href="privacy.html" class="hover:text-slate-900 transition">Privacy Policy</a>
            </div>
        </div>
    </footer>

</body>
</html>
