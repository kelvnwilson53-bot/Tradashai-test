<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to TriDash AI - Account Onboarding</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-slate-300 font-sans antialiased selection:bg-blue-600 selection:text-white min-h-screen flex flex-col justify-between">

    <!-- HEADER -->
    <header class="border-b border-slate-800 py-4 bg-black">
        <div class="max-w-4xl mx-auto px-4 flex justify-between items-center">
            <a href="index.html" class="text-xl font-bold text-white tracking-tight">
                TriDash<span class="text-blue-500 font-light">AI.com</span>
            </a>
            <span class="text-xs text-green-400 font-semibold flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span> Pilot Activated
            </span>
        </div>
    </header>

    <!-- MAIN ONBOARDING CARD -->
    <main class="max-w-xl mx-auto px-4 py-16 flex-1 w-full flex flex-col justify-center">
        <div class="bg-slate-950 p-8 sm:p-10 rounded-3xl border border-slate-800 shadow-2xl text-center space-y-6">
            
            <!-- GREEN SUCCESS ICON -->
            <div class="w-16 h-16 bg-green-500/10 text-green-400 border border-green-500/20 rounded-full flex items-center justify-center mx-auto text-3xl font-bold">
                ✓
            </div>

            <div>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-white mb-2">Welcome Aboard!</h1>
                <p class="text-slate-400 text-sm">Your 30-day TriDash AI pilot is now active. Let's set up your password to log into your dashboard.</p>
            </div>

            <hr class="border-slate-800">

            <!-- PASSWORD CREATION FORM -->
            <form action="login.html" class="space-y-4 text-left">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Create Account Password</label>
                    <input type="password" required placeholder="At least 8 characters" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 text-sm">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Confirm Password</label>
                    <input type="password" required placeholder="Re-enter password" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 text-sm">
                </div>

                <button type="submit" class="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl transition shadow-lg text-sm cursor-pointer mt-2">
                    Save Password & Access Dashboard →
                </button>
            </form>

            <p class="text-xs text-slate-500">
                A confirmation receipt has also been routed to your email address.
            </p>

        </div>
    </main>

    <!-- FOOTER -->
    <footer class="border-t border-slate-800 py-8 text-center text-xs text-slate-500">
        <p>&copy; TriDash AI. All rights reserved.</p>
    </footer>

</body>
</html>
