<!-- SCRIPT -->
    <script>
        const navDrawer = document.getElementById('nav-drawer');

        function toggleMenu() {
            if (navDrawer) navDrawer.classList.toggle('active');
        }

        function closeMenu() {
            if (navDrawer) navDrawer.classList.remove('active');
        }

        // Login Modal Control
        function openLoginModal() {
            const loginModal = document.getElementById('login-modal');
            if (loginModal) loginModal.classList.add('active');
            closeMenu();
        }

        function closeLoginModal() {
            const loginModal = document.getElementById('login-modal');
            if (loginModal) loginModal.classList.remove('active');
        }

        // Signup Modal Control
        function openSignupModal(tier) {
            const signupModal = document.getElementById('signup-modal');
            if (signupModal) signupModal.classList.add('active');
            
            if (tier === 'premium') {
                const radio = document.getElementById('modal-pkg-premium');
                if (radio) radio.checked = true;
            } else {
                const radio = document.getElementById('modal-pkg-standard');
                if (radio) radio.checked = true;
            }
            closeMenu();
        }

        function closeSignupModal() {
            const signupModal = document.getElementById('signup-modal');
            if (signupModal) signupModal.classList.remove('active');
        }

        // Check if user is already logged in when the page loads
        function checkActiveSession() {
            const savedUser = localStorage.getItem('tridash_user');
            if (savedUser) {
                // User is remembered! You can optionally update the UI or auto-redirect
                console.log("Welcome back, " + savedUser);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            checkActiveSession();

            // Hamburger Menu Toggle
            const menuBtn = document.getElementById('menu-btn');
            if (menuBtn) {
                menuBtn.addEventListener('click', toggleMenu);
            }

            // Close mobile menu on drawer link click
            document.querySelectorAll('.mobile-link').forEach(link => {
                link.addEventListener('click', closeMenu);
            });

            // Modal Button Triggers
            const desktopLoginBtn = document.getElementById('desktop-login-btn');
            const mobileLoginBtn = document.getElementById('mobile-login-btn');
            const drawerLoginBtn = document.getElementById('drawer-login-btn');
            const closeLoginBtn = document.getElementById('close-login-btn');
            const closeSignupBtn = document.getElementById('close-signup-btn');

            if (desktopLoginBtn) desktopLoginBtn.addEventListener('click', openLoginModal);
            if (mobileLoginBtn) mobileLoginBtn.addEventListener('click', openLoginModal);
            if (drawerLoginBtn) drawerLoginBtn.addEventListener('click', openLoginModal);
            if (closeLoginBtn) closeLoginBtn.addEventListener('click', closeLoginModal);
            if (closeSignupBtn) closeSignupBtn.addEventListener('click', closeSignupModal);

            // Login Form Submission with Memory Saving
            const loginForm = document.getElementById('login-form');
            if (loginForm) {
                loginForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const emailInput = loginForm.querySelector('input[type="email"]');
                    
                    // Save user session to browser memory
                    if (emailInput && emailInput.value) {
                        localStorage.setItem('tridash_user', emailInput.value);
                    }

                    alert('Login successful! Welcome to your TriDash Dashboard.');
                    closeLoginModal();
                });
            }

            // Signup Form Submission with Memory Saving
            const signupForm = document.getElementById('signup-form');
            if (signupForm) {
                signupForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const emailInput = document.getElementById('signup-email');

                    // Save user session to browser memory
                    if (emailInput && emailInput.value) {
                        localStorage.setItem('tridash_user', emailInput.value);
                    }

                    alert('Registration successful! Redirecting to setup portal...');
                    closeSignupModal();
                });
            }

            // Demo Simulation Button
            const demoBtn = document.getElementById('run-demo-btn');
            const demoStatus = document.getElementById('demo-status');
            if (demoBtn) {
                demoBtn.addEventListener('click', () => {
                    if (demoStatus) demoStatus.classList.remove('hidden');
                    demoBtn.textContent = "✓ Simulation Active";
                    demoBtn.classList.remove('bg-slate-900', 'text-slate-200');
                    demoBtn.classList.add('bg-blue-600', 'text-white');

                    setTimeout(() => {
                        demoBtn.textContent = "Test Live Speed Demo";
                        demoBtn.classList.remove('bg-blue-600', 'text-white');
                        demoBtn.classList.add('bg-slate-900', 'text-slate-200');
                        if (demoStatus) demoStatus.classList.add('hidden');
                    }, 4000);
                });
            }

            // ROI Calculator
            const jobSlider = document.getElementById('job-slider');
            const callsSlider = document.getElementById('calls-slider');
            const jobVal = document.getElementById('job-val');
            const callsVal = document.getElementById('calls-val');
            const lostRev = document.getElementById('lost-rev');

            function calculateROI() {
                if (!jobSlider || !callsSlider) return;
                const val = parseInt(jobSlider.value);
                const calls = parseInt(callsSlider.value);
                if (jobVal) jobVal.textContent = '$' + val;
                if (callsVal) callsVal.textContent = calls;
                if (lostRev) lostRev.textContent = '$' + Math.round(val * calls * 4).toLocaleString();
            }

            if (jobSlider && callsSlider) {
                jobSlider.addEventListener('input', calculateROI);
                callsSlider.addEventListener('input', calculateROI);
            }
        });
    </script>
