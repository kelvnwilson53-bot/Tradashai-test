<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start Your 7-Day Free Trial | TriDash AI</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html { scroll-behavior: smooth; }
        body { background: #ffffff; color: #1e293b; }
        
        .ambient-glow {
            position: absolute;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.05) 0%, transparent 70%);
            filter: blur(140px);
            pointer-events: none;
            z-index: 0;
        }

        .podium-card-3d {
            background: #ffffff;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(37, 99, 235, 0.15);
            box-shadow: 0 20px 45px rgba(30, 41, 59, 0.06);
        }

        .btn-podium-primary {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: #ffffff;
            font-weight: 700;
            transition: all 0.25s ease;
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .btn-podium-primary:hover {
            background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.35);
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="font-sans antialiased flex flex-col min-h-screen justify-between relative overflow-x-hidden">

    <div class="ambient-glow"></div>

    <!-- HEADER -->
    <header class="bg-white/90 sticky top-0 z-50 backdrop-blur-md border-b border-slate-200 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
            <a href="index.html" class="text-xl font-extrabold text-slate-900 tracking-tight">
                TriDash<span class="text-[#2563eb] font-semibold">AI.com</span>
            </a>
            <a href="login.html" class="text-xs font-semibold text-[#2563eb] hover:underline">Log In</a>
        </div>
    </header>

    <!-- SIGNUP MAIN -->
    <main class="flex-1 flex items-center justify-center py-12 px-4 relative z-10">
        <div class="w-full max-w-md">
            
            <div class="text-center mb-8">
                <span class="inline-block bg-blue-50 border border-blue-200 text-[#2563eb] text-xs font-bold px-4 py-1.5 rounded-full mb-3 shadow-sm">
                    🚀 7-Day Free Trial • Cancel Anytime
                </span>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">
                    Get Started with <span class="text-[#2563eb]">Sarah</span>
                </h1>
                <p class="text-xs sm:text-sm text-slate-600 mt-2">
                    Single line receptionist engine. $59/month after trial.
                </p>
            </div>

            <!-- LEAN FORM CARD -->
            <div class="podium-card-3d p-6 sm:p-8 rounded-3xl">
                <form action="dashboard.html" method="GET" class="space-y-5">
                    
                    <div>
                        <label for="business-name" class="block text-xs font-bold text-slate-800 uppercase tracking-wider mb-2">
                            Business / Company Name
                        </label>
                        <input type="text" id="business-name" name="business_name" required placeholder="e.g. Apex Plumbing & Building" class="w-full px-4 py-3 text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#2563eb] focus:border-transparent bg-slate-50">
                    </div>

                    <div>
                        <label for="phone-number" class="block text-xs font-bold text-slate-800 uppercase tracking-wider mb-2">
                            Main Business Phone Number
                        </label>
                        <input type="tel" id="phone-number" name="phone_number" required placeholder="e.g. (555) 000-0000" class="w-full px-4 py-3 text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#2563eb] focus:border-transparent bg-slate-50">
                    </div>

                    <div>
                        <label for="email" class="block text-xs font-bold text-slate-800 uppercase tracking-wider mb-2">
                            Email Address
                        </label>
                        <input type="email" id="email" name="email" required placeholder="you@yourcompany.com" class="w-full px-4 py-3 text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#2563eb] focus:border-transparent bg-slate-50">
                    </div>

                    <button type="submit" class="w-full py-4 btn-podium-primary font-bold rounded-xl text-sm transition shadow-lg mt-2">
                        Continue →
                    </button>
                    
                </form>

                <p class="text-[11px] text-center text-slate-400 mt-4">
                    Zero setup fees. Configure your trade settings inside the dashboard.
                </p>
            </div>

        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-white border-t border-slate-200 py-6 text-xs text-slate-500 text-center relative z-10">
        &copy; 2026 TriDash AI. All rights reserved.
    </footer>

</body>
</html>
